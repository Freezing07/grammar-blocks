<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拖积木学英语语法 · 第一章 新手村</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B1%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   一号区：设计变量。想改风格只动这一段。
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#0b1020;
  --panel:rgba(255,255,255,.055);
  --panel-2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12);
  --line-2:rgba(255,255,255,.2);
  --text:#eef2ff;
  --text-soft:#b6c0dc;
  --text-dim:#7d88a8;
  --accent:#6ea8ff;
  --accent-2:#8b7bff;
  --ok:#34d399;
  --bad:#fb7185;
  --warn:#fbbf24;
  --radius:14px;
  --shadow-block:0 3px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.28);
  --font: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font);
  color:var(--text);
  background:
    radial-gradient(1100px 600px at 15% -10%, #1d2c56 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #2a1d4d 0%, transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, #070a14 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.dragging{cursor:grabbing;}
body.dragging *{cursor:grabbing !important;}
button{font-family:inherit;font-size:inherit;color:inherit;}

.wrap{
  max-width:940px;
  margin:0 auto;
  padding:14px 14px 40px;
  min-height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ---------- 顶栏 ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  font-size:13px;color:var(--text-soft);white-space:nowrap;
}
.chip b{color:var(--text);font-weight:650;}
.hud .spacer{flex:1;}
.xp-bar{position:relative;width:120px;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;}
.xp-bar i{
  position:absolute;inset:0 auto 0 0;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .5s cubic-bezier(.2,.8,.3,1);
}

/* ---------- 关卡地图 ---------- */
.map-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:4px 2px 0;}
.map-head h1{margin:0;font-size:22px;letter-spacing:.01em;}
.map-head .sub{font-size:13px;color:var(--text-dim);}
.map-progress{font-size:13px;color:var(--text-soft);margin-left:auto;}
.map{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
  gap:12px;
  margin-top:12px;
}
.lv{
  position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;
  padding:14px 14px 12px;border-radius:18px;
  border:1px solid var(--line);
  background:linear-gradient(180deg, var(--panel), rgba(255,255,255,.02));
  cursor:pointer;
  transition:transform .14s, border-color .16s, box-shadow .16s, opacity .16s;
}
.lv:hover:not(:disabled){transform:translateY(-2px);border-color:var(--line-2);box-shadow:0 10px 24px rgba(0,0,0,.3);}
.lv:disabled{opacity:.45;cursor:not-allowed;}
.lv .top{display:flex;align-items:center;gap:8px;}
.lv .emoji{font-size:22px;}
.lv .id{font-size:12px;color:var(--text-dim);letter-spacing:.08em;font-weight:600;}
.lv .topic{font-size:17px;font-weight:650;}
.lv .goal{font-size:12.5px;color:var(--text-dim);line-height:1.5;min-height:2.6em;}
.lv .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
.lv .stars{font-size:15px;letter-spacing:2px;color:var(--warn);}
.lv .stars .off{color:rgba(255,255,255,.16);}
.lv.cleared{border-color:rgba(52,211,153,.4);}
.lv.boss{background:linear-gradient(180deg, rgba(251,191,36,.14), rgba(255,255,255,.02));border-color:rgba(251,191,36,.35);}
.lv .badge, .chip .badge{
  font-size:10.5px;padding:2px 7px;border-radius:999px;
  background:rgba(251,191,36,.2);color:#ffe6a8;border:1px solid rgba(251,191,36,.4);
}
.lv .lock{font-size:12.5px;color:var(--text-dim);}

/* ---------- 关卡内导航 ---------- */
.play-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.dot{
  width:26px;height:26px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);
  font-size:11px;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
  transition:transform .15s, border-color .15s, background .15s;
}
.dot:hover:not(:disabled){transform:translateY(-1px);border-color:var(--line-2);}
.dot.cur{border-color:var(--accent);background:rgba(110,168,255,.18);color:var(--text);}
.dot.cleared{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.14);color:#c9f7e5;}

/* ---------- 目标条 ---------- */
.goal{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:var(--radius);
  background:linear-gradient(90deg, rgba(110,168,255,.14), rgba(139,123,255,.08));
  border:1px solid rgba(110,168,255,.24);
  font-size:14px;color:#dbe5ff;line-height:1.5;
}
.goal .emoji{font-size:18px;}

/* ---------- 棋盘 ---------- */
.board{
  position:relative;border-radius:20px;padding:18px 16px;
  background:linear-gradient(180deg, var(--panel), rgba(255,255,255,.02));
  border:1px solid var(--line);min-height:220px;
  display:flex;flex-direction:column;justify-content:center;gap:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.board-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--text-dim);}
.board-head .cn{font-size:16px;color:#dfe7ff;font-weight:600;letter-spacing:.01em;}
.mode{
  font-size:11px;padding:2px 8px;border-radius:999px;
  background:rgba(139,123,255,.22);color:#ddd6ff;border:1px solid rgba(139,123,255,.4);
}
.mode.fix{background:rgba(251,113,133,.18);color:#ffd5dd;border-color:rgba(251,113,133,.4);}

/* ---------- Boss 计时 ---------- */
.timer{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:150px;}
.timer .bar{position:relative;flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;}
.timer .bar i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:999px;background:linear-gradient(90deg,#fbbf24,#fb7185);}
.timer .sec{font-size:12px;color:var(--warn);font-variant-numeric:tabular-nums;min-width:32px;text-align:right;}

/* ---------- 槽位 ---------- */
.slot-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;min-height:74px;}
.slot{
  position:relative;min-width:88px;min-height:60px;border-radius:12px;
  border:2px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.03);
  display:flex;align-items:center;justify-content:center;padding:6px;
  transition:border-color .18s, background .18s, transform .18s;
}
.slot .idx{font-size:12px;color:rgba(255,255,255,.22);font-weight:600;user-select:none;}
.slot.filled{border-style:solid;border-color:transparent;background:transparent;padding:0;}
.slot.pre{border-color:rgba(251,113,133,.35);}
.slot.hot{border-color:var(--accent);background:rgba(110,168,255,.16);transform:translateY(-2px);}
.slot.right{animation:popRight .5s ease-out;}
.slot.wrong{animation:shake .45s;border-color:var(--bad);background:rgba(251,113,133,.12);}
.slot.hint{animation:hintGlow .9s;}

@keyframes popRight{
  0%{transform:translateY(0) scale(1);}
  45%{transform:translateY(-6px) scale(1.06);}
  100%{transform:translateY(0) scale(1);}
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  15%{transform:translateX(-6px);}
  35%{transform:translateX(5px);}
  55%{transform:translateX(-4px);}
  75%{transform:translateX(3px);}
}
@keyframes hintGlow{
  0%{box-shadow:0 0 0 0 rgba(251,191,36,.6);}
  100%{box-shadow:0 0 0 18px rgba(251,191,36,0);}
}
.slot.right::after{
  content:"✓";position:absolute;top:-9px;right:-7px;
  width:20px;height:20px;border-radius:50%;
  background:var(--ok);color:#04241a;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(52,211,153,.5);
}
.period{font-size:30px;font-weight:700;color:var(--text-dim);line-height:1;padding-bottom:14px;}

/* ---------- 积木 ---------- */
.block{
  position:relative;display:inline-flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  padding:9px 14px 7px;border-radius:11px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--c) 92%, white 8%), var(--c));
  border:1px solid color-mix(in srgb, var(--c) 60%, black 40%);
  border-bottom-width:4px;
  border-bottom-color:color-mix(in srgb, var(--c) 55%, black 45%);
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);
  box-shadow:var(--shadow-block);cursor:grab;
  touch-action:none;user-select:none;-webkit-user-select:none;
  transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s, opacity .14s, filter .14s;
  will-change:transform;
}
.block .w{font-size:19px;font-weight:650;letter-spacing:.01em;line-height:1.15;white-space:nowrap;}
.block .p{font-size:10px;opacity:.85;letter-spacing:.14em;font-weight:600;white-space:nowrap;}
.block:hover{transform:translateY(-2px);}
.block:active{transform:translateY(0);}
.block.dragging{opacity:.22;filter:grayscale(.4);}
.block.ghost{
  position:fixed;z-index:999;pointer-events:none;margin:0;
  transform:translateY(-4px) scale(1.06) rotate(-1.5deg);
  box-shadow:0 16px 32px rgba(0,0,0,.5), 0 4px 0 rgba(0,0,0,.35);
  transition:none;
}
.block.flying{
  position:fixed;z-index:900;margin:0;pointer-events:none;
  transition:left .62s cubic-bezier(.22,.9,.25,1), top .62s cubic-bezier(.22,.9,.25,1),
             width .62s ease, height .62s ease, transform .62s cubic-bezier(.22,.9,.25,1);
}
.block.small .w{font-size:17px;}

/* ---------- 积木库 ---------- */
.tray-wrap{border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:12px;}
.tray-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px;color:var(--text-dim);}
.tray{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;min-height:64px;}
.tray:empty::after{content:"积木都用完了";color:var(--text-dim);font-size:13px;padding:12px;}

/* ---------- 按钮 ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{
  padding:11px 20px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--panel-2);
  cursor:pointer;font-weight:600;font-size:15px;
  transition:transform .12s, background .16s, border-color .16s, opacity .16s;
}
.btn:hover:not(:disabled){transform:translateY(-1px);background:rgba(255,255,255,.14);}
.btn:active:not(:disabled){transform:translateY(0);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.primary{
  border-color:transparent;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#06122b;box-shadow:0 8px 20px rgba(110,168,255,.3);
}
.btn.primary:hover:not(:disabled){box-shadow:0 10px 26px rgba(110,168,255,.42);}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text-soft);}
.btn.small{padding:7px 13px;font-size:13px;border-radius:10px;}
.btn .k{font-size:12px;opacity:.7;margin-left:6px;font-weight:500;}

/* ---------- 反馈卡 ---------- */
.fb{
  border-radius:16px;padding:14px 16px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  display:flex;flex-direction:column;gap:10px;
  animation:fbIn .3s cubic-bezier(.2,.8,.3,1);
}
@keyframes fbIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fb.bad{border-color:rgba(251,113,133,.4);background:linear-gradient(180deg,rgba(251,113,133,.12),rgba(251,113,133,.03));}
.fb.good{border-color:rgba(52,211,153,.4);background:linear-gradient(180deg,rgba(52,211,153,.12),rgba(52,211,153,.03));}
.fb h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;line-height:1.45;}
.fb p{margin:0;font-size:14.5px;line-height:1.65;color:#dbe2f5;}
.fb .ls{display:flex;gap:8px;align-items:flex-start;}
.fb .tag{
  flex:none;font-size:11px;padding:3px 8px;border-radius:999px;
  background:rgba(255,255,255,.1);color:var(--text-soft);margin-top:2px;white-space:nowrap;
}
.fb .eg{font-size:14px;color:var(--text-soft);font-style:italic;line-height:1.6;}
.stars{font-size:22px;letter-spacing:2px;}

/* ---------- 语法树 ---------- */
.tree-card{display:none;flex-direction:column;gap:10px;}
.board.tree-mode .slot-row,
.board.tree-mode .board-head{display:none;}
.board.tree-mode .tree-card{display:flex;}
.board.tree-mode{justify-content:flex-start;}
.tree-sentence{text-align:center;font-size:20px;font-weight:600;color:#eaf0ff;letter-spacing:.01em;}
.tree-sentence .ok{margin-left:8px;color:var(--ok);}
.tree-canvas{position:relative;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:26px;}
.tree-lines{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.tree-lines path{fill:none;stroke:rgba(255,255,255,.3);stroke-width:1.6;}
.tree-node{
  padding:5px 14px;border-radius:9px;
  background:rgba(255,255,255,.09);border:1px solid var(--line-2);
  font-size:13px;font-weight:600;color:#dce4ff;white-space:nowrap;
}
.tree-node.root{
  background:linear-gradient(135deg,rgba(110,168,255,.35),rgba(139,123,255,.3));
  border-color:rgba(110,168,255,.5);font-size:14px;
  opacity:0;animation:nodeIn .4s .35s forwards;
}
.tree-groups{display:flex;gap:22px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
.tgroup{display:flex;flex-direction:column;align-items:center;gap:24px;opacity:0;animation:nodeIn .4s forwards;}
@keyframes nodeIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.leaves{display:flex;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
.leaf{display:flex;flex-direction:column;align-items:center;gap:5px;}
.leaf-slot{display:flex;align-items:center;justify-content:center;border-radius:11px;}
.leaf-slot .block{cursor:default;}
.leaf-role{font-size:10.5px;color:var(--text-dim);letter-spacing:.05em;opacity:0;animation:nodeIn .4s .6s forwards;}

/* ---------- 通关页 ---------- */
.done{
  display:none;flex-direction:column;gap:16px;align-items:center;text-align:center;
  padding:26px 18px;border-radius:20px;
  background:linear-gradient(180deg,rgba(110,168,255,.14),rgba(255,255,255,.02));
  border:1px solid rgba(110,168,255,.3);
}
.done.show{display:flex;animation:fbIn .4s;}
/* .done 是 align-items:center 的纵向 flex，子元素会被压成内容宽度，所以撑满 */
.done #doneWriting{width:100%;max-width:640px;text-align:left;}
.done h2{margin:0;font-size:24px;}
.done .big-stars{font-size:40px;letter-spacing:6px;color:var(--warn);}
.done .stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--text-soft);}
.done .stats b{color:var(--text);font-size:18px;display:block;}

/* ---------- 飘字 ---------- */
.toast{
  position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);
  font-size:26px;font-weight:800;pointer-events:none;z-index:1200;
  color:var(--ok);text-shadow:0 4px 20px rgba(0,0,0,.6);
  opacity:0;transition:opacity .3s, transform .6s cubic-bezier(.2,.8,.3,1);
  text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,-90%) scale(1);}
.fly-layer{position:fixed;inset:0;pointer-events:none;z-index:900;}
.hint-text{font-size:12.5px;color:var(--text-dim);line-height:1.6;}
[hidden]{display:none !important;}

@media (max-width:560px){
  .wrap{padding:10px 10px 32px;}
  .block .w{font-size:17px;}
  .slot{min-width:74px;min-height:54px;}
  .chip{font-size:12px;padding:5px 9px;}
  .hud .xp-bar{display:none;}
  .tree-groups{gap:14px;}
  .map{grid-template-columns:1fr 1fr;}
  .lv .goal{display:none;}
  .timer{min-width:110px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ---------- 章节分组 ---------- */
.chapter{margin-top:20px;}
.chapter-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 2px 0;}
.chapter-head h2{margin:0;font-size:19px;letter-spacing:.01em;}
.chapter-head .sub{font-size:12.5px;color:var(--text-dim);}
.chapter-head .prog{font-size:12.5px;color:var(--text-soft);margin-left:auto;}
.chapter.locked .map{opacity:.42;filter:grayscale(.65);}
.chapter-note{font-size:12.5px;color:var(--warn);margin:8px 2px 0;line-height:1.6;}
/* ---------- 语法树节点（可嵌套） ---------- */
.tnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;opacity:0;animation:nodeIn .4s forwards;}
.tnode-kids{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
.tnode.clause > .tree-node{background:rgba(251,191,36,.16);border-color:rgba(251,191,36,.42);color:#ffe6a8;}
/* ---------- 非谓语标记：这个动词形式不是句子的谓语 ---------- */
.leaf.nonfinite .leaf-slot{outline:1px dashed rgba(244,114,182,.65);outline-offset:4px;border-radius:15px;}
.leaf.nonfinite .leaf-role{color:#f9a8d4;}

/* ---------- 段落排序模式：积木是一整句话，竖着排 ---------- */
.slot-row.vertical{flex-direction:column;align-items:stretch;gap:9px;}
.slot.wide{min-width:0;width:100%;min-height:58px;justify-content:flex-start;}
.tray.vertical{flex-direction:column;align-items:stretch;gap:9px;}
.sblock{
  display:flex;width:100%;align-items:stretch;
  padding:11px 14px;border-radius:12px;
  border:1px solid rgba(110,168,255,.35);
  border-left:4px solid var(--accent);
  background:linear-gradient(180deg, rgba(110,168,255,.16), rgba(110,168,255,.07));
  box-shadow:0 3px 10px rgba(0,0,0,.22);
  cursor:grab;touch-action:none;user-select:none;
  transition:transform .14s, box-shadow .14s, opacity .14s, filter .14s;
}
.sblock .t{font-size:15px;line-height:1.55;color:#eaf0ff;font-weight:500;white-space:normal;}
.sblock:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.3);}
.sblock.ghost{position:fixed;z-index:999;pointer-events:none;margin:0;transform:rotate(-1deg);box-shadow:0 16px 32px rgba(0,0,0,.5);}
.sblock.dragging{opacity:.25;filter:grayscale(.3);}

/* ---------- 段落结构（答对之后）：句子按顺序落下，中间亮出逻辑关系 ---------- */
.flow-card{display:none;flex-direction:column;gap:12px;}
.board.flow-mode .slot-row,
.board.flow-mode .board-head{display:none;}
.board.flow-mode .flow-card{display:flex;}
.board.flow-mode{justify-content:flex-start;}
.flow-head{font-size:13px;color:var(--text-dim);letter-spacing:.08em;}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:4px;}
.flow-item{
  display:flex;flex-direction:column;gap:3px;
  padding:11px 14px;border-radius:12px;
  background:linear-gradient(180deg, rgba(52,211,153,.14), rgba(52,211,153,.05));
  border:1px solid rgba(52,211,153,.32);border-left:4px solid var(--ok);
  opacity:0;animation:flowIn .45s cubic-bezier(.2,.8,.3,1) forwards;
}
.flow-sent{font-size:15px;line-height:1.55;color:#eaf0ff;}
.flow-role{font-size:11px;color:var(--text-dim);letter-spacing:.06em;}
.flow-link{
  display:flex;align-items:center;gap:8px;padding-left:18px;
  opacity:0;animation:flowIn .45s cubic-bezier(.2,.8,.3,1) forwards;
}
.flow-link .arrow{color:var(--accent);font-size:14px;line-height:1;}
.flow-link .rel{font-size:11.5px;color:var(--warn);letter-spacing:.06em;}
@keyframes flowIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- 错题本 ---------- */
.pocket{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.pcard{
  display:flex;flex-direction:column;gap:6px;
  padding:13px 15px;border-radius:16px;
  border:1px solid rgba(251,113,133,.32);
  border-left:4px solid var(--bad);
  background:linear-gradient(180deg, rgba(251,113,133,.10), rgba(255,255,255,.02));
}
.pcard-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.pcard-lv{font-size:12px;color:var(--accent);letter-spacing:.04em;}
.pcard-n{font-size:11.5px;color:var(--bad);}
.pcard-cn{font-size:15px;color:#eaf0ff;line-height:1.5;}
.pcard-ex{font-size:13px;color:var(--text-soft);line-height:1.65;}
.pcard .btn{align-self:flex-start;margin-top:2px;}
.pocket-empty{color:var(--text-dim);font-size:14px;padding:18px 4px;line-height:1.8;}
.dot.wide-dot{width:auto;min-width:44px;padding:0 7px;font-size:10.5px;letter-spacing:.02em;}

/* ---------- 关卡卡片：闯关 + 练习两个动作 ---------- */
.lv .lv-play{
  display:flex;flex-direction:column;gap:6px;width:100%;
  padding:14px 14px 10px;text-align:left;
  background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;
}
.lv .lv-practice{
  margin:0 14px 13px;padding:7px 12px;border-radius:10px;
  border:1px solid rgba(110,168,255,.42);
  background:rgba(110,168,255,.14);color:#cfe0ff;
  font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background .15s, border-color .15s;
}
.lv .lv-practice:hover{background:rgba(110,168,255,.26);border-color:rgba(110,168,255,.7);}
/* 写作提示词：练习模式是「认出来」，写作是「写出来」，所以按钮颜色跟练习分开 */
.lv .lv-writing{
  display:block;width:calc(100% - 28px);margin:0 14px 13px;padding:7px 12px;
  border-radius:10px;border:1px solid rgba(244,114,182,.42);
  background:rgba(244,114,182,.12);color:#f7cfe4;
  font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background .15s, border-color .15s;
}
.lv .lv-writing:hover{background:rgba(244,114,182,.24);border-color:rgba(244,114,182,.7);}
.lv .lv-practice + .lv-writing{margin-top:-4px;}

.wp-card{
  margin-top:16px;padding:14px 16px;border-radius:14px;text-align:left;
  border:1px solid rgba(244,114,182,.34);background:rgba(244,114,182,.07);
}
.wp-card h3{margin:0 0 4px;font-size:15px;color:#f7cfe4;}
.wp-card .wp-why{margin:0 0 10px;font-size:12.5px;line-height:1.7;color:#c9cede;}
.wp-text{
  margin:0;padding:12px 13px;max-height:180px;overflow:auto;
  border-radius:10px;border:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.28);color:#e8ecf6;
  font:12.5px/1.75 ui-monospace,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-word;
}
.wp-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.wp-actions .wp-note{font-size:12px;color:#9aa3b8;}

/* 写作提示词弹窗（地图上的常驻入口用） */
.wp-modal{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(6,8,16,.72);backdrop-filter:blur(3px);
  padding:24px;overflow:auto;
}
.wp-modal.show{display:flex;align-items:flex-start;justify-content:center;}
.wp-modal-inner{
  width:min(720px,100%);margin:auto;background:#141a26;
  border:1px solid rgba(255,255,255,.12);border-radius:16px;
  padding:18px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.wp-modal .wp-card{margin-top:12px;background:transparent;border:0;padding:0;}
.wp-modal .wp-text{max-height:min(52vh,420px);}
.wp-modal-head{display:flex;align-items:center;gap:10px;}
.wp-modal-head h3{margin:0;font-size:16px;color:#f7cfe4;flex:1;}
.lv.locked{opacity:.45;}
.lv.locked .lv-play{cursor:not-allowed;}

<div class="wrap">

          <div class="tree-node root" id="treeRoot">S 句子</div>
          <div class="tree-groups" id="treeGroups"></div>

      </div>

        <div class="flow-head">段落结构</div>

      </div>

        <span>🧱 积木库 · 拖到上面的槽位里（也可以点一下，自动放进空位）</span>
        <span id="trayCount"></span>
      </div>
      <div class="tray" id="tray"></div>
    </section>

    <div class="actions" id="actions" style="margin-top:12px">
      <button class="btn primary" id="btnSubmit" disabled>提交 <span class="k">Enter</span></button>
      <button class="btn ghost" id="btnHint">提示（少一颗星）</button>
      <button class="btn ghost" id="btnReset">重来</button>

</div>

<div class="fly-layer" id="flyLayer"></div>

</div>

        {

          "goal": "观点 → 理由 → 例子 → 结论：中国学生最该练熟的段落骨架",

            {

              "cn": "把这几句话排成一段通顺的话",

              "blocks": [

                { "text": "It is convenient because you can study anywhere.", "role": "理由" },

              "links": ["理由", "举例", "总结"],
              "distractors": [
                { "text": "My brother is a teacher in a middle school.", "role": "多余的一句" }

              "explain": "这是最标准的英语段落骨架：主题句（观点）→ 理由 → 例子 → 结论。信号词也很明显：For example 一定跟在理由后面，In conclusion 一定在最后。最后那句讲哥哥是老师，和「在线学习」这个主题没有任何关系。",
              "example": "观点 → 理由 → For example… → In conclusion…",
              "win": "观点、理由、例子、结论，一段就这四块。"

            {
              "id": "7-2-r2",
              "mode": "order",
              "cn": "把这几句话排成一段通顺的话",
              "tip": "First of all / Moreover 提示这两句是并列的理由",
              "blocks": [
                { "text": "Reading is one of the best habits.", "role": "主题句（观点）" },
                { "text": "First of all, it builds your vocabulary.", "role": "理由一" },
                { "text": "Moreover, it helps you think more clearly.", "role": "理由二" },
                { "text": "To sum up, everyone should read every day.", "role": "结论" }

              "distractors": [

              "explain": "First of all 和 Moreover 是成对出现的：一个提第一点，一个补第二点，所以它们必须连着。To sum up 收尾。最后那句谈的是书价，这段谈的是阅读习惯，主题不搭。",
              "example": "观点 → First of all… → Moreover… → To sum up…",
              "win": "First of all 和 Moreover 是成套的。"

              "id": "7-2-r3",
              "mode": "order",
              "cn": "把这几句话排成一段通顺的话",
              "tip": "Therefore 表示「因此」，只能用在结论句",
              "blocks": [
                { "text": "Exercising every day is important.", "role": "主题句（观点）" },

                { "text": "It also makes you feel happier.", "role": "理由二" },

              "distractors": [

              "explain": "第二句和第三句是并列的两个好处，用 It also 衔接。Therefore 引出结论，必须放最后。买鞋那句虽然和运动沾边，但它是个人琐事，支撑不了观点。",

        {

          "topic": "因果链",

          "goal": "起因 → 结果 → 接着 → 最后：让每一句都能接上上一句",

              "tip": "As a result 前面一定是原因",
              "blocks": [

              "links": ["导致", "于是", "最终"],
              "distractors": [
                { "text": "The airport was very clean and modern.", "role": "多余的一句" }

              "explain": "As a result 的信号很硬：它前面必须是原因（天气糟糕），后面才是结果（航班取消）。后面两句顺着「结果」往下推：先滞留，最后改坐火车。机场干净那句是无关细节。",
              "example": "起因 → As a result… → 于是… → In the end…",
              "win": "As a result 前面永远跟着原因。"
            },
            {
              "id": "7-3-r2",
              "mode": "order",
              "cn": "把这几句话排成一段通顺的话",
              "tip": "考砸之后，人的反应、再之后做了什么",
              "blocks": [
                { "text": "Tom did not study for the exam.", "role": "起因" },

                { "text": "His parents were very disappointed.", "role": "反应" },

              "distractors": [
                { "text": "The exam was held in a large hall.", "role": "多余的一句" }
              ],
              "explain": "Therefore 说明第二句是第一句的结果；第三句是结果带来的反应；第四句是反应之后的行动。这样一环扣一环。考场大不大，对这条因果链没有任何影响。",
              "example": "没有复习 → Therefore 挂了 → 父母失望 → 他下决心",
              "win": "每一句都要能接上上一句。"

            {
              "id": "7-3-r3",
              "mode": "order",
              "cn": "把这几句话排成一段通顺的话",
              "tip": "两句 As a result / Finally 把链条串起来",
              "blocks": [
                { "text": "The city built a new subway line.", "role": "起因" },
                { "text": "Therefore, many people gave up driving.", "role": "结果一" },
                { "text": "As a result, the air became much cleaner.", "role": "结果二" },
                { "text": "Finally, the city won an environmental prize.", "role": "最终" }

              "links": ["因此", "进一步导致", "最终"],
              "distractors": [

              "explain": "这一段的因果是层层推进的：修地铁 → 少开车 → 空气变好 → 得奖。两个连接词 Therefore 和 As a result 交替使用，避免重复。有几站是细节，插进来会把链条打断。",
              "example": "修地铁 → Therefore → As a result → Finally",
              "win": "因果可以一层一层往下推。"
            }
          ]
        },

        {

        {
