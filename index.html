<script>
(function () {
  'use strict';

  /* ---------- 词性配色：全项目唯一来源 ---------- */
  var POS = {
    noun:    { label: '名词',   color: '#4A90D9' },
    pronoun: { label: '代词',   color: '#06B6D4' },
    verb:    { label: '动词',   color: '#EF4444' },
    adj:     { label: '形容词', color: '#10B981' },
    adv:     { label: '副词',   color: '#F59E0B' },
    article: { label: '冠词',   color: '#9CA3AF' },
    prep:    { label: '介词',   color: '#8B5CF6' },
    conj:    { label: '连词',   color: '#EAB308' },
    inf:     { label: '不定式符号', color: '#F472B6' }
  };

  var DATA = JSON.parse(document.getElementById('levelData').textContent);
  var CHAPTERS = DATA.chapters;
  var SAVE_KEY = 'grammarBlocks.v2';

  /* 把各章关卡摊平成一个数组，闯关顺序就是数组顺序；
     每关记下自己属于哪一章，地图渲染时再分组。 */
  var LEVELS = [];
  CHAPTERS.forEach(function (c, ci) {
    c.levels.forEach(function (lv) { lv._ci = ci; LEVELS.push(lv); });
  });
  function chapterOfLevel(i) { return CHAPTERS[LEVELS[i]._ci]; }
  // 练习句展开在最后统一做（expandPractice 在下面定义，函数声明会提升）
  function buildPractice() {
    LEVELS.forEach(function (lv) { lv.practiceRounds = expandPractice(lv); });
  }

  /* ---------- 存档 ---------- */
  function loadSave() {
    var base = { xp: 0, levels: {}, muted: false, pocket: {} };
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return base;
      var o = JSON.parse(raw);
      return {
        xp: typeof o.xp === 'number' ? o.xp : 0,
        levels: o.levels && typeof o.levels === 'object' ? o.levels : {},
        muted: !!o.muted,
        pocket: o.pocket && typeof o.pocket === 'object' ? o.pocket : {}
      };
    } catch (e) { return base; }
  }
  var save = loadSave();
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }
  function levelSave(id) {
    if (!save.levels[id]) save.levels[id] = { rounds: {}, cleared: false, stars: 0 };
    if (!save.levels[id].rounds) save.levels[id].rounds = {};
    return save.levels[id];
  }
  function isUnlocked(i) {
    if (i <= 0) return true;
    return !!levelSave(LEVELS[i - 1].id).cleared;
  }
  function isChapterUnlocked(ci) {
    if (ci <= 0) return true;
    var prev = CHAPTERS[ci - 1];
    return !!levelSave(prev.levels[prev.levels.length - 1].id).cleared;
  }

  /* ---------- 状态 ---------- */
  var state = {
    li: 0,          // 当前关卡在 LEVELS 里的下标
    queue: [],      // 这一轮要做哪几句（正常＝全部；错题重练＝只做错的那几句）
    qi: 0,          // 当前在 queue 里的位置
    session: 'level', // level＝正常闯关，review＝本关错题重练，pocket＝错题本
    review: false,  // 是不是重练（review 或 pocket）
    wrong: {},      // 本轮答错过的题目，键是 "关卡下标|句子下标"
    lastWrong: [],  // 本轮做错的题目节点
    slots: [], tray: [], pool: {}, order: [],
    attempts: 0, hintUsed: false, timeouts: 0,
    phase: 'play',
    levelStars: {}
  };

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    hudChapter: $('hudChapter'), hudLevelChip: $('hudLevelChip'),
    hudLevel: $('hudLevel'), hudXp: $('hudXp'), hudXpBar: $('hudXpBar'),
    btnMap: $('btnMap'), btnMute: $('btnMute'),
    mapView: $('mapView'), map: $('map'), mapProgress: $('mapProgress'),
    pocketView: $('pocketView'), pocket: $('pocket'), pocketCount: $('pocketCount'),
    btnPocket: $('btnPocket'), btnPocketAll: $('btnPocketAll'), btnPocketBack: $('btnPocketBack'),
    playView: $('playView'), playTitle: $('playTitle'), dots: $('dots'),
    goalText: $('goalText'),
    board: $('board'), boardHead: $('boardHead'), boardTip: $('boardTip'),
    cnMeaning: $('cnMeaning'), modeBadge: $('modeBadge'),
    timerWrap: $('timerWrap'), timerBar: $('timerBar'), timerText: $('timerText'),
    slotRow: $('slotRow'), tray: $('tray'), trayCount: $('trayCount'),
    trayWrap: $('trayWrap'), actions: $('actions'),
    btnSubmit: $('btnSubmit'), btnHint: $('btnHint'), btnReset: $('btnReset'),
    fbHost: $('fbHost'), flyLayer: $('flyLayer'), toast: $('toast'),
    treeCard: $('treeCard'), treeSentence: $('treeSentence'), treeRoot: $('treeRoot'),
    treeGroups: $('treeGroups'), treeLines: $('treeLines'), treeCanvas: $('treeCanvas'),
    flowCard: $('flowCard'), flow: $('flow'),
    done: $('done'), doneStars: $('doneStars'), doneStats: $('doneStats'),
    doneTitle: $('doneTitle'), doneNote: $('doneNote'), doneWriting: $('doneWriting'),
    wpModal: $('wpModal'), wpModalTitle: $('wpModalTitle'), wpModalBody: $('wpModalBody'),
    btnWpClose: $('btnWpClose'),
    btnBackMap: $('btnBackMap'), btnNextLevel: $('btnNextLevel'), btnReview: $('btnReview')
  };

  /* ---------- 声音（WebAudio 合成，不依赖音频文件）---------- */
  var actx = null;
  function audio() {
    if (actx) return actx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { actx = new AC(); } catch (e) { actx = null; }
    return actx;
  }
  function tone(freq, start, dur, gain, type) {
    if (save.muted) return;
    var ctx = audio(); if (!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    var t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var sfx = {
    pick:  function () { tone(520, 0, 0.07, 0.07, 'triangle'); },
    drop:  function () { tone(300, 0, 0.09, 0.09, 'triangle'); },
    back:  function () { tone(220, 0, 0.08, 0.07, 'sine'); },
    wrong: function () { tone(300, 0, 0.16, 0.12, 'sawtooth'); tone(200, 0.12, 0.22, 0.1, 'sawtooth'); },
    right: function () { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * 0.09, 0.4, 0.14, 'sine'); }); },
    level: function () { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone(f, i * 0.12, 0.5, 0.15, 'triangle'); }); }
  };
  function renderMute() {
    els.btnMute.textContent = save.muted ? '🔇' : '🔊';
    els.btnMute.title = save.muted ? '音效已关，点一下打开' : '音效已开，点一下关掉';
  }
  els.btnMute.addEventListener('click', function () {
    save.muted = !save.muted;
    persist();
    renderMute();
    if (!save.muted) sfx.drop();
  });

  /* ---------- 工具 ---------- */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }
  function toast(msg, color) {
    els.toast.textContent = msg;
    els.toast.style.color = color || '#34d399';
    els.toast.classList.add('show');
    clearTimeout(els.toast._t);
    els.toast._t = setTimeout(function () { els.toast.classList.remove('show'); }, 1100);
  }
  function levelOf(xp) { return Math.max(1, Math.floor(xp / 100) + 1); }
  function starStr(n) {
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < n ? '★' : '☆');
    return s;
  }
  // 一个会话节点 = {li, ri, src}，src 是 rounds（闯关）或 practice（练习）
  function srcRounds(li, src) {
    var lv = LEVELS[li];
    return src === 'practice' ? (lv.practiceRounds || []) : lv.rounds;
  }
  function nodeKey(n) { return n.li + '|' + (n.src === 'practice' ? 'p' : 'r') + n.ri; }
  function curNode() { return state.queue[state.qi] || { li: state.li, ri: 0, src: 'rounds' }; }
  function curLevel() { return LEVELS[curNode().li]; }
  function curRound() { var n = curNode(); return srcRounds(n.li, n.src)[n.ri]; }
  function practiceRounds(i) { return LEVELS[i].practiceRounds || []; }
  function targetOf(round) { return round.blocks.map(function (b) { return b.text; }); }
  function punctOf(round) { return round.punct || '.'; }
  function isOrder(round) { return round.mode === 'order'; }

  /* ---------- 顶栏 ---------- */
  function renderHud() {
    els.hudLevel.textContent = levelOf(save.xp);
    els.hudXp.textContent = save.xp;
    els.hudXpBar.style.width = (save.xp % 100) + '%';
    var playing = !els.playView.hidden;
    els.hudLevelChip.hidden = !playing;
    els.btnMap.hidden = !playing;
    els.btnPocket.hidden = playing || !els.pocketView.hidden;
    var pc = pocketCount();
    els.btnPocket.textContent = pc ? ('📕 错题本 ' + pc) : '📕 错题本';
    els.hudChapter.innerHTML = CHAPTERS[LEVELS[state.li]._ci].emoji +
      ' <b>' + chapterOfLevel(state.li).name + '</b>';
    if (playing) {
      els.hudLevelChip.innerHTML = curLevel().id + ' <b>' + curLevel().topic + '</b>';
    }
    renderMute();
  }

  /* ---------- 关卡地图 ---------- */
  function showMap() {
    stopBossTimer();
    els.playView.hidden = true;
    els.pocketView.hidden = true;
    els.done.classList.remove('show');
    els.mapView.hidden = false;
    renderMap();
    renderHud();
  }

  /* ---------- 错题本视图 ---------- */
  function showPocket() {
    stopBossTimer();
    els.playView.hidden = true;
    els.mapView.hidden = true;
    els.done.classList.remove('show');
    els.pocketView.hidden = false;
    renderPocket();
    renderHud();
  }

  function renderPocket() {
    var list = pocketList(false);
    var all = pocketList(true);
    els.pocketCount.textContent = list.length ? ('还有 ' + list.length + ' 句没拿下') : '全部拿下';
    els.btnPocketAll.disabled = list.length === 0;
    els.pocket.innerHTML = '';
    if (!list.length) {
      els.pocket.appendChild(el('p', 'pocket-empty', all.length
        ? '之前错过的句子都拿下了 👍　　一共' + all.length + ' 句，做对过的不会再来烦你。'
        : '还没有错题。答错的句子会自动收进来 —— 不用担心忘掉哪一句没掌握。'));
      return;
    }
    list.forEach(function (it) {
      var lv = LEVELS[it.li], r = srcRounds(it.li, it.src)[it.ri];
      var card = el('div', 'pcard');
      var head = el('div', 'pcard-head');
      head.appendChild(el('span', 'pcard-lv', lv.emoji + ' ' + lv.id + ' · ' + lv.topic));
      head.appendChild(el('span', 'pcard-n', '错过 ' + it.e.n + ' 次'));
      card.appendChild(head);
      card.appendChild(el('div', 'pcard-cn', r.cn));
      card.appendChild(el('div', 'pcard-ex', r.explain));
      var btn = el('button', 'btn ghost small', '单练这一句');
      btn.type = 'button';
      btn.addEventListener('click', function () {
        startSession([{ li: it.li, ri: it.ri, src: it.src }], 'pocket');
      });
      card.appendChild(btn);
      els.pocket.appendChild(card);
    });
  }

  function renderMap() {
    els.map.innerHTML = '';
    var cleared = 0, starsGot = 0;
    LEVELS.forEach(function (lv) {
      var s = levelSave(lv.id);
      if (s.cleared) cleared++;
      starsGot += (s.stars || 0);
    });
    els.mapProgress.textContent = '已通关 ' + cleared + '/' + LEVELS.length +
      '　·　★ ' + starsGot + '/' + (LEVELS.length * 3);

    CHAPTERS.forEach(function (ch, ci) {
      var open = isChapterUnlocked(ci);
      var sec = el('section', 'chapter' + (open ? '' : ' locked'));

      var head = el('div', 'chapter-head');
      head.appendChild(el('h2', null, ch.emoji + ' ' + ch.name));
      head.appendChild(el('span', 'sub', ch.subtitle + ' · ' + ch.levels.length + ' 关'));
      var done = 0, got = 0;
      ch.levels.forEach(function (lv) {
        var s = levelSave(lv.id);
        if (s.cleared) done++;
        got += (s.stars || 0);
      });
      head.appendChild(el('span', 'prog', done + '/' + ch.levels.length + ' 关　★' +
        got + '/' + (ch.levels.length * 3)));
      sec.appendChild(head);

      var grid = el('div', 'map');
      ch.levels.forEach(function (lv) {
        var gi = LEVELS.indexOf(lv);
        var s = levelSave(lv.id);
        var unlocked = isUnlocked(gi);
        var b = el('div', 'lv' + (s.cleared ? ' cleared' : '') + (lv.boss ? ' boss' : '') +
          (unlocked ? '' : ' locked'));
        b.dataset.level = lv.id;
        var play = el('button', 'lv-play');
        play.type = 'button';
        play.dataset.level = lv.id;
        if (!unlocked) { play.disabled = true; play.title = '先通关 ' + LEVELS[gi - 1].id; }
        b.appendChild(play);

        var top = el('div', 'top');
        top.appendChild(el('span', 'emoji', unlocked ? lv.emoji : '🔒'));
        top.appendChild(el('span', 'id', lv.id));
        if (lv.boss) top.appendChild(el('span', 'badge', 'BOSS · 限时'));
        play.appendChild(top);
        play.appendChild(el('div', 'topic', lv.topic));
        play.appendChild(el('div', 'goal', unlocked ? lv.goal : '通关上一关后解锁'));

        var foot = el('div', 'foot');
        var st = el('div', 'stars');
        var n = s.stars || 0;
        for (var k = 0; k < 3; k++) st.appendChild(el('span', k < n ? '' : 'off', k < n ? '★' : '☆'));
        foot.appendChild(st);
        foot.appendChild(el('span', 'lock', s.cleared ? (s.stars >= 3 ? '已精通' : '再来一次')
          : (unlocked ? '开始 ▸' : '🔒')));
        play.appendChild(foot);

        play.addEventListener('click', function () { startLevel(gi); });

        // 通关之后才开放练习模式
        var pr = practiceRounds(gi).length;
        if (unlocked && pr) {
          var pb = el('button', 'lv-practice');
          pb.type = 'button';
          pb.dataset.practice = lv.id;
          pb.textContent = '练习模式 · 再来 ' + pr + ' 句';
          pb.addEventListener('click', function () { startPractice(gi); });
          b.appendChild(pb);
        }
        // 写作提示词：常驻入口，不要求做过练习 —— 想什么时候写都可以。
        // 第七章（段落排序）没有提示词，这里就不会出现按钮。
        if (unlocked && writingPromptOf(gi)) {
          var wb = el('button', 'lv-writing');
          wb.type = 'button';
          wb.dataset.writing = lv.id;
          wb.textContent = '✍️ 写作提示词 · 贴给 AI 练翻译';
          wb.addEventListener('click', function () { openWritingModal(gi); });
          b.appendChild(wb);
        }
        grid.appendChild(b);
      });
      sec.appendChild(grid);

      if (!open) {
        sec.appendChild(el('p', 'chapter-note',
          '通关「' + CHAPTERS[ci - 1].name + '」的 Boss（' +
          CHAPTERS[ci - 1].levels[CHAPTERS[ci - 1].levels.length - 1].id + '）后解锁。'));
      }
      els.map.appendChild(sec);
    });
  }

  /* ---------- 练习模式 ----------
     练习数据是紧凑写法：一关声明一次「句型骨架 + 语法规则」，
     每道题只写一行。启动时展开成普通的句子对象 ——
     展开之后判定、语法树、错题本这些全都照旧工作，不用为练习单写一套。 */

  // 哪些「词性 + 角色」组合算非谓语（练习展开时按这个补 nonfinite 标记）
  var NONFINITE_ROLES = {
    'verb|不定式': 1, 'verb|动名词': 1, 'verb|现在分词': 1, 'verb|过去分词': 1,
    'verb|宾补': 1, 'verb|分词': 1
  };

  /* ---------- 写作提示词 ----------
     练习模式练的是「认出来」（给积木池、给错的块，你只要识别）；
     自由写作练的是「写出来」。这一步挂不掉在应用里 —— 没有模型、没有批改。
     所以这里只做一件事：生成一段针对本关语法点的提示词，
     用户自己贴到任意 AI 对话里，由那边一句句出中文、批改、继续。
     生成逻辑和 _p/prompt.js 是同一份，改一处要同步另一处。 */
  function buildWritingPrompt(id, topic, goal, rules, mode, boss) {
    var pair = mode === 'pair';
    var unit = pair ? '组' : '句';
    // 关卡主题里带「 · Boss」，对 AI 说「我在练 连词 · Boss」很怪，去掉
    var name = String(topic || '').replace(/\s*·\s*Boss\s*$/, '');
    var L = [];

    L.push('你是一位耐心、友善的英语语法教练。我正在练一个语法点：' + name + '（' + id + ' 关）。');
    L.push('我是初学者，说错了很正常，别让我紧张，也别催我。');
    if (goal) L.push('这一关的目标：' + goal);
    if (boss) L.push('这是整章的混合复习关：下面这些点会混着考。');
    L.push('');

    L.push('【这一关的规则】');
    (rules || []).forEach(function (r) { L.push('- ' + r); });
    L.push('');

    L.push('【怎么带我练】');
    if (pair) {
      L.push('1. 一次只给我一组中文（两句，之间要有明确的逻辑关系），等我翻成两句英文。');
      L.push('   不要一次给多组，也不要先示范。');
    } else {
      L.push('1. 一次只给我一句中文，等我翻成英文。不要一次给多句，也不要先示范。');
    }
    L.push('2. 在我给出答案之前，绝对不要透露英文答案，也不要给「这里该用' +
      (pair ? '哪个衔接词' : '哪个词、哪个时态') + '」这类等于报答案的提示。');
    L.push('3. 我交卷后按这个顺序回我，讲解用中文：');
    if (pair) {
      L.push('   ① 先说我哪里做对了；② 再说哪里要改、错在上面哪一条规则上；');
      L.push('   ③ 给出正确的写法；④ 有没有更自然的说法（没有就说没有）。');
      L.push('4. 重点盯这几件事：衔接词选得对不对、放的位置对不对、标点对不对。');
      L.push('   尤其是句首衔接词后面的逗号，少一个意思就变了。');
    } else {
      L.push('   ① 先说我哪里做对了；② 再说哪里要改、错在上面哪一条规则上；');
      L.push('   ③ 给出正确的写法；④ 有没有更自然的说法（没有就说没有）。');
    }
    var k = pair ? 5 : 4;
    L.push(k++ + '. 如果我的译法和你想的不一样、但也是对的，要算对 ——');
    L.push('   ' + (pair ? '一组中文' : '一句中文') + '常常有好几种合法译法，不要为了坚持一个标准答案而判错。');
    L.push(k++ + '. 我说「不会」或「跳过」，就直接给答案并解释，然后出下一' + unit +
      '，不要说「这很简单」。');
    L.push('');

    L.push('【说话的方式】');
    L.push('- 用大白话、口语一点，别端着教科书那种架子。');
    L.push('- 我答对了，具体夸一句我哪里做对了（指出是哪个词、哪条规则做对了），不要只说「很好」。');
    L.push('- 我答错了，先肯定对的部分，再说哪里要改，别一上来就否定。');
    L.push('- 非用语法术语不可的时候，紧跟一句人话解释。');
    L.push('- 别说「显然」「很简单」「这你应该知道」这种让人泄气的话。');
    L.push('- 表情符号一两个点缀就好，不要每句话都加。');
    L.push('- 慢慢来没关系，我要的是真的懂，不是做得快。');
    L.push('');

    L.push('【出题的讲究】');
    L.push('- 只考上面列出的规则，不要夹带我没练过的语法点（别的从句、完成时、虚拟语气等），也不要用生僻词。');
    if (pair) {
      L.push('- 你给的中文要能明确看出两句之间的关系（转折 / 因果 / 举例 / 让步 / 指代 / 总结），');
      L.push('  不要给我两句各说各的、看不出关系的话。');
    } else {
      L.push('- 你给的中文要明确指向目标结构，不能让我猜你是想练什么。');
      L.push('  （别给我一句用不用这个语法点都成立的句子。）');
    }
    L.push('- 如果某条规则跟当前这一' + unit + '无关，忽略它，不要硬套。');
    if (boss) {
      L.push('- 这是混合复习，所以轮着考上面这几条规则，不要连着出同一条；');
      L.push('  但每一' + unit + '只考一个点，不要一句话里塞两个考点。');
    } else if (pair) {
      L.push('- 难度慢慢递进：先给关系直白的两句，后面再换衔接词的种类、换逻辑关系。');
    } else {
      L.push('- 难度慢慢递进：先直白的一句，后面再换主语、换时态、换句型（否定、疑问）。');
    }
    L.push('');

    L.push('【节奏】');
    L.push('出满 10 ' + unit + '就停下来，用中文总结：先说我进步的地方，再说我最常错的是哪一条规则、' +
      '具体错在哪几' + unit + '上，然后问我要不要继续。');
    L.push('过程中如果我总是错同一条规则，就多出考这条规则的句子，别不耐烦；');
    L.push('如果我一直答对，就把难度往上加一点，别一直重复同样的难度。');
    L.push('');
    L.push('现在开始，出第一' + unit + '中文。');

    return L.join('\n');
  }

  // 这一关的写作提示词；第七章（段落排序）没有 —— 那个语法点不是单句/两句能练的
  function writingPromptOf(li) {
    var lv = LEVELS[li];
    if (!lv) return null;
    if (String(lv.id).indexOf('7-') === 0) return null;
    var p = (DATA.practice || {})[lv.id];
    if (!p || !p.rules || !p.rules.length) return null;
    var mode = String(lv.id).indexOf('6-') === 0 ? 'pair' : 'sentence';
    return buildWritingPrompt(lv.id, lv.topic, lv.goal, p.rules, mode, lv.boss === true);
  }

  /* 复制。navigator.clipboard 在 file:// 或老浏览器里可能没有，
     所以留一条选中 + execCommand 的老路；两条都不行就告诉用户手动复制。 */
  function copyText(text, btn, okMsg) {
    function done() {
      toast(okMsg || '提示词已复制，去粘贴给 AI 吧');
      if (btn) {
        var old = btn.textContent;
        btn.textContent = '✓ 已复制';
        setTimeout(function () { btn.textContent = old; }, 1400);
      }
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { done(); return; }
      } catch (e) { /* 落到下面的兜底 */ }
      toast('复制失败，请手动选中提示词后按 Ctrl+C', '#fca5a5');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* 写作卡片：结算页和弹窗共用同一份，避免两处各写一遍 */
  function writingCard(li) {
    var text = writingPromptOf(li);
    if (!text) return null;
    var lv = LEVELS[li];

    var card = el('div', 'wp-card');
    card.appendChild(el('h3', null, '✍️ 再往前一步：把它写出来'));
    card.appendChild(el('p', 'wp-why',
      '练习模式练的是「认出来」—— 积木在池子里、错的那一块也指给你了。' +
      '可是写作的时候没人给你这些。下面这段提示词贴给任意 AI 对话（网页版、App 都行），' +
      '它会一句句出中文、你翻成英文、它给你批改，专门练这一关的语法点。'));

    var pre = el('pre', 'wp-text', text);
    card.appendChild(pre);

    var acts = el('div', 'wp-actions');
    var copy = el('button', 'btn primary small', '📋 复制提示词');
    copy.type = 'button';
    copy.dataset.wpCopy = lv.id;
    copy.addEventListener('click', function () { copyText(text, copy); });
    acts.appendChild(copy);

    var len = el('span', 'wp-note', text.length + ' 字 · 共 10 ' +
      (String(lv.id).indexOf('6-') === 0 ? '组' : '句') + '，练完让它总结你常错的规则');
    acts.appendChild(len);
    card.appendChild(acts);
    return card;
  }

  function openWritingModal(li) {
    var card = writingCard(li);
    if (!card) { toast('这一关没有写作提示词', '#fca5a5'); return; }
    els.wpModalTitle.textContent = '✍️ ' + LEVELS[li].id + ' · ' + LEVELS[li].topic + ' 写作提示词';
    els.wpModalBody.innerHTML = '';
    els.wpModalBody.appendChild(card);
    els.wpModal.classList.add('show');
  }
  function closeWritingModal() { els.wpModal.classList.remove('show'); }

  function expandPractice(lv) {
    var p = (DATA.practice || {})[lv.id];
    if (!p) return [];
    // 段落排序的练习：给一串打乱的句子，排出通顺的一段
    if (p.paragraphs) {
      return p.paragraphs.map(function (it, k) {
        return {
          id: lv.id + '-p' + (k + 1),
          practice: true,
          mode: 'order',
          rootLabel: '句群',
          cn: it.cn || '把这几句话排成一段通顺的话',
          tip: '练习：把句子排成通顺的一段',
          blocks: it.s.map(function (text, i) {
            return { text: text, role: (it.roles && it.roles[i]) || '' };
          }),
          distractors: (it.d || []).map(function (text) {
            return { text: text, role: '多余的一句' };
          }),
          links: it.links || [],
          explain: (p.rules && p.rules[it.r || 0]) || '看看段落是怎么串起来的。',
          example: '正确顺序：' + it.s.join(' '),
          win: '这一段你顺下来了。'
        };
      });
    }
    if (!p.patterns || !p.items) return [];
    return p.items.map(function (it, k) {
      var pat = p.patterns[it.p || 0];
      var blocks = it.w.map(function (word, i) {
        var s = pat[i] || pat[pat.length - 1];
        var b = { text: word, pos: s[0], role: s[1], group: s[2] };
        // 非谓语在例题里是粉色虚线叶子。练习的骨架只写了 [词性, 角色, 分组]，
        // 放不下这个标记 —— 但它其实是「词性 + 角色」的函数，这里推出来，
        // 免得练习模式的语法树和例题长得不一样。
        if (NONFINITE_ROLES[b.pos + '|' + b.role]) b.nonfinite = true;
        return b;
      });
      var dists = [];
      var firstWrong = null;
      var dmap = it.d || {};
      Object.keys(dmap).forEach(function (word) {
        var i = dmap[word];
        var s = pat[i] || pat[pat.length - 1];
        dists.push({ text: word, pos: s[0], role: s[1], group: s[2] });
        if (!firstWrong) firstWrong = { word: word, at: i };
      });

      var round = {
        id: lv.id + '-p' + (k + 1),
        practice: true,
        cn: it.c || '',
        tip: '把错的那一块换掉',
        groups: p.groups,
        blocks: blocks,
        distractors: dists,
        explain: (p.rules && p.rules[it.r || 0]) || '看看正确的写法。',
        win: '这一句拿下了。'
      };
      if (it.m) round.marks = it.m;
      if (p.punct) round.punct = p.punct;

      // 反馈面板里的「正确：」也要带上标点，否则多句题会连成一串没标点的字。
      // 标点规则和槽位渲染一致：marks 里指定的优先，最后一个槽位默认用句末标点。
      var exMarks = round.marks || {};
      var exEnd = punctOf(round);
      round.example = '正确：' + it.w.map(function (w, i) {
        var m = exMarks[i] !== undefined ? exMarks[i]
              : (i === it.w.length - 1 ? exEnd : '');
        return w + m;
      }).join(' ');

      // 预填：o 是显式的错误顺序（用来出「顺序错」的题）；
      // 否则有中文就照中文拼句子，没中文就用错误形式预填成改错题
      if (it.o) {
        round.prefill = it.o.slice();
        round.tip = '改错练习：把它调回正确的顺序';
      } else if (!it.c && firstWrong) {
        var pre = it.w.slice();
        pre[firstWrong.at] = firstWrong.word;
        round.prefill = pre;
        round.tip = '改错练习：找出错的那一块换掉';
      }
      return round;
    });
  }

  /* ---------- 错题本 ----------
     记的是「你在哪一句上摔过跤」，跨关卡保存。
     规则：任何时候答错都会记进来；只有在错题本练习里第一次就做对，才算拿下。 */
  function pocketKey(levelId, roundId) { return levelId + '|' + roundId; }
  function noteWrong(levelId, roundId) {
    if (!save.pocket) save.pocket = {};
    var k = pocketKey(levelId, roundId);
    var e = save.pocket[k] || { levelId: levelId, roundId: roundId, n: 0, cleared: false, t: 0 };
    e.n++;
    e.cleared = false;
    e.t = Date.now();
    save.pocket[k] = e;
    persist();
  }
  function noteRight(levelId, roundId) {
    var e = save.pocket && save.pocket[pocketKey(levelId, roundId)];
    if (!e || e.cleared) return;
    e.cleared = true;
    e.t = Date.now();
    persist();
  }
  // 把存档里的记录还原成 {li, ri, e}，找不到的（内容改过了）直接跳过
  function pocketList(includeCleared) {
    var out = [];
    var p = save.pocket || {};
    Object.keys(p).forEach(function (k) {
      var e = p[k];
      if (!includeCleared && e.cleared) return;
      var li = LEVELS.findIndex(function (l) { return l.id === e.levelId; });
      if (li < 0) return;
      var src = 'rounds';
      var ri = LEVELS[li].rounds.findIndex(function (r) { return r.id === e.roundId; });
      if (ri < 0) {
        src = 'practice';
        ri = (LEVELS[li].practiceRounds || []).findIndex(function (r) { return r.id === e.roundId; });
      }
      if (ri < 0) return;
      out.push({ li: li, ri: ri, src: src, e: e });
    });
    out.sort(function (a, b) { return (b.e.t || 0) - (a.e.t || 0); });
    return out;
  }
  function pocketCount() { return pocketList(false).length; }

  /* ---------- 进入某一关 ---------- */
  /* 一次练习 = 一串「关卡+句子」节点。正常闯关是一关的全部句子，
     错题重练和错题本是挑出来的句子 —— 所以可以跨关卡。 */
  function startSession(queue, session, li) {
    if (!queue.length) return;
    state.session = session;
    state.review = session !== 'level';
    state.queue = queue;
    state.qi = 0;
    state.li = (li === undefined || li === null) ? queue[0].li : li;
    state.wrong = {};
    state.lastWrong = [];
    state.levelStars = {};
    var s = levelSave(curLevel().id);
    Object.keys(s.rounds || {}).forEach(function (k) { state.levelStars[k] = s.rounds[k]; });
    els.mapView.hidden = true;
    els.pocketView.hidden = true;
    els.playView.hidden = false;
    els.done.classList.remove('show');
    els.goalText.textContent = session === 'pocket'
      ? '练你错过的句子 —— 这一轮共 ' + queue.length + ' 句'
      : session === 'practice'
        ? curLevel().goal + '　·　练习模式：把错的积木换掉'
        : curLevel().goal;
    startRound(0);
  }

  function startLevel(i) {
    if (!isUnlocked(i)) return;
    startSession(LEVELS[i].rounds.map(function (r, k) {
      return { li: i, ri: k, src: 'rounds' };
    }), 'level', i);
  }

  /* 练习模式：通关之后才开放，句数更多，不计星级但照常给 XP */
  function startPractice(i) {
    var pr = practiceRounds(i);
    if (!pr.length) return;
    startSession(pr.map(function (r, k) {
      return { li: i, ri: k, src: 'practice' };
    }), 'practice', i);
  }

  /* ---------- 开一句 ---------- */
  function startRound(qi) {
    state.qi = qi;
    if (state.queue[qi]) state.li = state.queue[qi].li;
    var round = curRound();
    state.attempts = 0;
    state.hintUsed = false;
    state.timeouts = 0;
    state.phase = 'play';
    state.pool = {};
    state.order = [];

    round.blocks.forEach(function (b, k) {
      var uid = 't' + k;
      state.pool[uid] = b;
      state.order.push(uid);
    });
    var extra = [];
    round.distractors.forEach(function (b, k) {
      var uid = 'd' + k;
      state.pool[uid] = b;
      extra.push(uid);
    });

    state.slots = new Array(round.blocks.length).fill(null);
    state.tray = shuffle(state.order.concat(extra));

    // 改错模式：先把句子摆好（里面藏着错），让玩家换掉
    (round.prefill || []).forEach(function (text, idx) {
      for (var k = 0; k < state.tray.length; k++) {
        if (state.pool[state.tray[k]].text === text) {
          state.slots[idx] = state.tray[k];
          state.tray.splice(k, 1);
          break;
        }
      }
    });

    els.board.classList.remove('tree-mode');
    els.board.classList.remove('flow-mode');
    els.board.style.display = '';
    els.done.classList.remove('show');
    els.mapView.hidden = true;
    els.playView.hidden = false;
    els.boardHead.hidden = false;
    els.cnMeaning.textContent = round.practice
      ? (round.cn ? '意思：' + round.cn : '练习：把错的那一块换掉')
      : (isOrder(round) ? '任务：' : '中文意思：') + round.cn;
    els.boardTip.textContent = '· ' + round.tip;
    els.modeBadge.textContent = round.practice ? '练习'
      : round.prefill ? '改错'
      : (state.review ? '错题重练' : '拼句');
    els.modeBadge.className = 'mode' + (round.prefill ? ' fix' : '');
    els.fbHost.innerHTML = '';
    els.flow.innerHTML = '';
    els.actions.style.display = '';
    els.trayWrap.style.display = '';
    setSubmitHandler(submit);
    els.btnSubmit.innerHTML = '提交 <span class="k">Enter</span>';
    els.btnSubmit.onclick = null;

    renderSlots();
    renderTray();
    renderDots();
    renderHud();
    updateSubmit();
    startBossTimer();
  }

  /* ---------- 渲染 ---------- */
  function makeBlock(uid) {
    var b = state.pool[uid];
    // 段落排序模式：一块积木就是一整句话，不用词性上色
    if (isOrder(curRound())) {
      var c = el('div', 'block sblock');
      c.dataset.uid = uid;
      c.appendChild(el('span', 't', b.text));
      return c;
    }
    var d = el('div', 'block');
    d.dataset.uid = uid;
    d.style.setProperty('--c', (POS[b.pos] || { color: '#94a3b8' }).color);
    d.title = (POS[b.pos] ? POS[b.pos].label : b.pos) + ' · ' + b.role;
    d.appendChild(el('span', 'w', b.text));
    d.appendChild(el('span', 'p', (POS[b.pos] || { label: b.pos }).label));
    return d;
  }
  /* 每个槽位后面该跟什么标点：marks 里指定的优先，
     最后一个槽位默认用句末标点。靠这个，一关里可以放好几个句子。 */
  function markAfter(round, i) {
    if (isOrder(round)) return '';
    var marks = round.marks || {};
    if (marks[i] !== undefined) return marks[i];
    return i === round.blocks.length - 1 ? punctOf(round) : '';
  }
  function renderSlots() {
    var round = curRound();
    var prefilled = round.prefill || [];
    var vertical = isOrder(round);
    els.slotRow.className = 'slot-row' + (vertical ? ' vertical' : '');
    els.slotRow.innerHTML = '';
    state.slots.forEach(function (uid, i) {
      var s = el('div', 'slot' + (uid ? ' filled' : '') + (prefilled[i] ? ' pre' : '') +
        (vertical ? ' wide' : ''));
      s.dataset.index = String(i);
      if (uid) s.appendChild(makeBlock(uid));
      else s.appendChild(el('span', 'idx', String(i + 1)));
      els.slotRow.appendChild(s);
      var m = markAfter(round, i);
      if (m) els.slotRow.appendChild(el('div', 'period', m));
    });
  }
  function renderTray() {
    els.tray.className = 'tray' + (isOrder(curRound()) ? ' vertical' : '');
    els.tray.innerHTML = '';
    state.tray.forEach(function (uid) { els.tray.appendChild(makeBlock(uid)); });
    els.trayCount.textContent = '还剩 ' + state.tray.length + ' 块';
  }
  function render() { renderSlots(); renderTray(); updateSubmit(); }
  function updateSubmit() {
    var full = state.slots.every(function (u) { return !!u; });
    els.btnSubmit.disabled = !full || state.phase !== 'play';
  }
  function renderDots() {
    var lv = curLevel();
    els.playTitle.innerHTML = lv.emoji + ' ' + lv.id + ' <b>' + lv.topic + '</b>' +
      (lv.boss ? ' <span class="badge">BOSS</span>' : '') +
      (state.session === 'pocket' ? ' <span class="badge">错题本</span>' :
       state.session === 'review' ? ' <span class="badge">错题重练</span>' :
       state.session === 'practice' ? ' <span class="badge">练习</span>' : '');
    els.dots.innerHTML = '';
    // 跨关卡的练习，进度点上显示关卡号，否则只看句号会乱
    var multi = state.queue.some(function (n) { return n.li !== state.queue[0].li; });
    if (state.queue.length > 20) multi = true;   // 练习句多，用句号会挤爆
    state.queue.forEach(function (n, k) {
      var r = srcRounds(n.li, n.src)[n.ri];
      var b = el('button', 'dot', multi ? (state.session === 'practice' ? String(k + 1) : LEVELS[n.li].id) : String(n.ri + 1));
      if (multi && state.session !== 'practice') b.classList.add('wide-dot');
      b.type = 'button';
      var st = (levelSave(LEVELS[n.li].id).rounds || {})[r.id] || 0;
      if (st && !state.review) { b.classList.add('cleared'); b.textContent = '★'; b.title = st + ' 星'; }
      if (k === state.qi) b.classList.add('cur');
      b.title = r.cn + (st ? '　' + st + ' 星' : '');
      b.addEventListener('click', function () { if (state.phase !== 'judging') startRound(k); });
      els.dots.appendChild(b);
    });
  }

  /* ---------- Boss 计时 ---------- */
  var boss = { id: null, end: 0, total: 0, running: false };
  function startBossTimer() {
    stopBossTimer();
    var round = curRound();
    if (!round || !round.timeLimit) {
      els.timerWrap.hidden = true;
      return;
    }
    boss.total = round.timeLimit * 1000;
    boss.end = Date.now() + boss.total;
    boss.running = true;
    els.timerWrap.hidden = false;
    els.timerBar.style.width = '100%';
    tickBoss();
  }
  function tickBoss() {
    if (!boss.running) return;
    var left = boss.end - Date.now();
    if (left <= 0) { onBossTimeout(); return; }
    els.timerBar.style.width = Math.max(0, left / boss.total * 100) + '%';
    els.timerText.textContent = Math.ceil(left / 1000) + 's';
    boss.id = setTimeout(tickBoss, 100);
  }
  function onBossTimeout() {
    // 超时不判错，只记一次「超时」，代价是一颗星
    state.timeouts++;
    sfx.wrong();
    toast('⏰ 时间到，再给你一次', '#fbbf24');
    boss.end = Date.now() + boss.total;
    tickBoss();
  }
  function stopBossTimer() {
    boss.running = false;
    if (boss.id) { clearTimeout(boss.id); boss.id = null; }
  }

  /* ---------- 放置 ---------- */
  function takeFromTray(uid) {
    var i = state.tray.indexOf(uid);
    if (i >= 0) state.tray.splice(i, 1);
  }
  function slotOf(uid) { return state.slots.indexOf(uid); }
  function firstEmpty() { return state.slots.indexOf(null); }

  function placeInto(uid, index) {
    if (state.phase !== 'play') return;
    var from = slotOf(uid);
    var occupant = state.slots[index];
    if (from >= 0) state.slots[from] = null;
    else takeFromTray(uid);
    if (occupant && occupant !== uid) {
      if (from >= 0) state.slots[from] = occupant;
      else state.tray.push(occupant);
    }
    state.slots[index] = uid;
    render();
  }
  function backToTray(uid) {
    var from = slotOf(uid);
    if (from < 0) return;
    state.slots[from] = null;
    state.tray.push(uid);
    render();
  }
  function tapBlock(uid) {
    if (slotOf(uid) >= 0) { backToTray(uid); sfx.back(); return; }
    var i = firstEmpty();
    if (i >= 0) { placeInto(uid, i); sfx.drop(); }
  }

  /* ---------- 拖拽（Pointer Events，鼠标 + 触屏同一套）---------- */
  var drag = null;
  document.addEventListener('pointerdown', function (e) {
    if (e.button != null && e.button !== 0) return;
    var blockEl = e.target.closest ? e.target.closest('.block') : null;
    if (!blockEl || state.phase !== 'play') return;
    var inTray = !!blockEl.closest('#tray');
    var inSlot = blockEl.closest('.slot');
    if (!inTray && !inSlot) return;
    var r = blockEl.getBoundingClientRect();
    drag = {
      uid: blockEl.dataset.uid, el: blockEl,
      startX: e.clientX, startY: e.clientY,
      offX: e.clientX - r.left, offY: e.clientY - r.top,
      w: r.width, h: r.height, active: false, ghost: null
    };
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    e.preventDefault();
  });

  function onMove(e) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(e.clientX - drag.startX) < 6 && Math.abs(e.clientY - drag.startY) < 6) return;
      drag.active = true;
      document.body.classList.add('dragging');
      var g = drag.el.cloneNode(true);
      g.classList.add('ghost');
      g.style.width = drag.w + 'px';
      g.style.height = drag.h + 'px';
      els.flyLayer.appendChild(g);
      drag.ghost = g;
      drag.el.classList.add('dragging');
      sfx.pick();
    }
    drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
    drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
    highlightSlot(e.clientX, e.clientY);
    e.preventDefault();
  }
  function slotUnder(x, y) {
    var node = document.elementFromPoint(x, y);
    if (!node || !node.closest) return null;
    return node.closest('.slot');
  }
  function highlightSlot(x, y) {
    var target = slotUnder(x, y);
    Array.prototype.forEach.call(els.slotRow.querySelectorAll('.slot'), function (s) {
      s.classList.toggle('hot', s === target);
    });
  }
  function clearHot() {
    Array.prototype.forEach.call(els.slotRow.querySelectorAll('.slot'), function (s) {
      s.classList.remove('hot');
    });
  }
  function onUp(e) {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (!drag) return;
    var d = drag; drag = null;
    document.body.classList.remove('dragging');
    clearHot();
    if (d.ghost) d.ghost.remove();
    d.el.classList.remove('dragging');
    if (!d.active) { tapBlock(d.uid); return; }
    var slot = slotUnder(e.clientX, e.clientY);
    if (slot) { placeInto(d.uid, Number(slot.dataset.index)); sfx.drop(); }
    else if (e.clientY > (els.tray.getBoundingClientRect().top - 40)) { backToTray(d.uid); sfx.back(); }
    else { render(); }
  }

  /* ---------- 提示 ---------- */
  els.btnHint.addEventListener('click', function () {
    if (state.phase !== 'play') return;
    var target = targetOf(curRound());
    var idx = -1;
    for (var i = 0; i < target.length; i++) {
      var cur = state.slots[i];
      if (!cur || state.pool[cur].text !== target[i]) { idx = i; break; }
    }
    if (idx < 0) return;
    state.hintUsed = true;
    var wantUid = null;
    for (var k = 0; k < state.order.length; k++) {
      if (state.pool[state.order[k]].text === target[idx]) { wantUid = state.order[k]; break; }
    }
    if (!wantUid) return;
    var displaced = state.slots[idx];
    if (displaced) state.slots[idx] = null;
    var old = slotOf(wantUid);
    if (old >= 0) state.slots[old] = null;
    takeFromTray(wantUid);
    if (displaced && displaced !== wantUid) state.tray.push(displaced);
    state.slots[idx] = wantUid;
    render();
    var s = els.slotRow.querySelectorAll('.slot')[idx];
    if (s) s.classList.add('hint');
    sfx.drop();
    updateSubmit();
  });
  els.btnReset.addEventListener('click', function () {
    if (state.phase === 'tree') return;
    startRound(state.qi);
  });
  /* 提交按钮上永远只挂一个处理函数。
     以前用 addEventListener 累加，答对之后如果点了进度点跳到别的句子，
     再点提交会同时触发「提交」和「下一句」—— 句子刚拼对就被跳走。 */
  function setSubmitHandler(fn) {
    els.btnSubmit.removeEventListener('click', submit);
    els.btnSubmit.removeEventListener('click', nextRoundOnce);
    els.btnSubmit.addEventListener('click', fn);
  }
  setSubmitHandler(submit);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && state.phase === 'play' && !els.btnSubmit.disabled) {
      e.preventDefault();
      submit();
    }
  });

  /* ---------- 判定 ---------- */
  function submit() {
    if (state.phase !== 'play') return;
    if (!state.slots.every(function (u) { return !!u; })) return;
    state.phase = 'judging';
    state.attempts++;
    stopBossTimer();
    els.btnSubmit.disabled = true;

    var round = curRound();
    var target = targetOf(round);
    var marks = state.slots.map(function (uid, i) { return state.pool[uid].text === target[i]; });
    var allRight = marks.every(Boolean);
    var slotEls = els.slotRow.querySelectorAll('.slot');
    marks.forEach(function (ok, i) { slotEls[i].classList.add(ok ? 'right' : 'wrong'); });

    if (allRight) {
      // 只有在错题本练习里「一次就过」，才把它从错题本划掉
      if (state.session === 'pocket' && state.attempts === 1) {
        noteRight(curLevel().id, round.id);
      }
      sfx.right();
      toast('✓ 拼对了！', '#34d399');
      showGood(round);
      setTimeout(function () {
        if (isOrder(round)) showFlow(round);
        else riseIntoTtree(round);
      }, 380);
    } else {
      state.wrong[nodeKey(curNode())] = true;
      noteWrong(curLevel().id, round.id);
      sfx.wrong();
      showBad(round, marks);
      setTimeout(function () {
        state.slots.forEach(function (uid, i) {
          if (!marks[i] && uid) { state.slots[i] = null; state.tray.push(uid); }
        });
        state.phase = 'play';
        render();
        startBossTimer();
      }, 1500);
    }
  }

  /* ---------- 反馈卡 ---------- */
  function card(cls) {
    var d = el('div', 'fb ' + cls);
    els.fbHost.innerHTML = '';
    els.fbHost.appendChild(d);
    return d;
  }
  function showBad(round, marks) {
    var wrongNo = [];
    marks.forEach(function (ok, i) { if (!ok) wrongNo.push(i + 1); });
    var c = card('bad');
    var h = el('h3');
    h.appendChild(el('span', null, '🤔'));
    h.appendChild(el('span', null, '第 ' + wrongNo.join('、') + ' 个槽位还不对'));
    c.appendChild(h);
    var ls = el('div', 'ls');
    ls.appendChild(el('span', 'tag', '为什么'));
    ls.appendChild(el('p', null, round.explain));
    c.appendChild(ls);
    var ls2 = el('div', 'ls');
    ls2.appendChild(el('span', 'tag', '看看这两句'));
    ls2.appendChild(el('div', 'eg', round.example));
    c.appendChild(ls2);
  }
  function starCountFor() {
    var s = 3;
    if (state.hintUsed) s -= 1;
    if (state.attempts >= 2) s -= 1;
    if (state.timeouts >= 1) s -= 1;
    if (state.attempts >= 4) s -= 1;
    return Math.max(1, s);
  }
  function showGood(round) {
    var stars = starCountFor();
    if (!state.review) {
      state.levelStars[round.id] = Math.max(state.levelStars[round.id] || 0, stars);
      var ls = levelSave(curLevel().id);
      ls.rounds[round.id] = Math.max(ls.rounds[round.id] || 0, stars);
    }
    var gain = stars * 10 + 5;
    save.xp += gain;
    persist();
    renderHud();
    renderDots();

    var c = card('good');
    var h = el('h3');
    h.appendChild(el('span', null, '🎉'));
    h.appendChild(el('span', null, '你掌握了：' + round.win));
    c.appendChild(h);
    var row = el('div', 'ls');
    row.appendChild(el('span', 'stars', starStr(stars)));
    row.appendChild(el('p', null, '本句 +' + gain + ' XP　·　已用 ' + state.attempts + ' 次提交' +
      (state.hintUsed ? '　·　用了提示' : '') + (state.timeouts ? '　·　超时 ' + state.timeouts + ' 次' : '')));
    c.appendChild(row);

    var last = state.qi + 1 >= state.queue.length;
    els.btnSubmit.innerHTML = (last ? (state.review ? '完成重练 → ' : '完成本关 → ') : '下一句 → ') +
      '<span class="k">Enter</span>';
    els.btnSubmit.disabled = false;
    els.btnSubmit.onclick = null;
    setSubmitHandler(nextRoundOnce);
  }
  function nextRoundOnce() {
    setSubmitHandler(submit);
    nextRound();
  }
  function nextRound() {
    if (state.qi + 1 < state.queue.length) startRound(state.qi + 1);
    else finishLevel();
  }

  /* 段落排序的「结构看得见」：句子按顺序落下，中间亮出逻辑关系。
     换成语法树没有意义 —— 段落的关系不在句子内部，而在句子之间。 */
  function showFlow(round) {
    state.phase = 'tree';
    var flow = els.flow;
    flow.innerHTML = '';
    round.blocks.forEach(function (b, i) {
      var item = el('div', 'flow-item');
      item.style.animationDelay = (i * 0.16) + 's';
      item.appendChild(el('div', 'flow-sent', b.text));
      item.appendChild(el('div', 'flow-role', (i + 1) + '· ' + (b.role || '')));
      flow.appendChild(item);
      if (i < round.blocks.length - 1) {
        var lk = el('div', 'flow-link');
        lk.style.animationDelay = (i * 0.16 + 0.1) + 's';
        lk.appendChild(el('span', 'arrow', '↓'));
        lk.appendChild(el('span', 'rel', (round.links && round.links[i]) || ''));
        flow.appendChild(lk);
      }
    });
    els.board.classList.add('flow-mode');
  }

  /* ---------- 灵魂：积木升起变成语法树 ---------- */
  function riseIntoTtree(round) {
    state.phase = 'tree';
    els.treeRoot.textContent = round.rootLabel || 'S 句子';
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var starts = round.blocks.map(function (b, i) {
      var uid = state.order[i];
      var node = els.slotRow.querySelector('[data-uid="' + uid + '"]');
      var r = node.getBoundingClientRect();
      return { uid: uid, rect: r, node: node };
    });

    buildTree(round);
    els.board.classList.add('tree-mode');

    var ends = round.blocks.map(function (b, i) {
      var leaf = els.treeGroups.querySelector('.leaf[data-uid="' + state.order[i] + '"]');
      var box = leaf.querySelector('.leaf-slot');
      box.style.width = starts[i].rect.width + 'px';
      box.style.height = starts[i].rect.height + 'px';
      box.style.minWidth = starts[i].rect.width + 'px';
      return { rect: box.getBoundingClientRect(), box: box };
    });
    drawTreeLines();

    if (reduce) {
      ends.forEach(function (e, i) { e.box.appendChild(starts[i].node); });
      return;
    }

    var moving = [];
    starts.forEach(function (s, i) {
      var node = s.node, r = s.rect;
      node.classList.add('flying');
      node.style.left = r.left + 'px';
      node.style.top = r.top + 'px';
      node.style.width = r.width + 'px';
      node.style.height = r.height + 'px';
      els.flyLayer.appendChild(node);
      moving.push({ node: node, to: ends[i].rect, box: ends[i].box, delay: i * 90 });
    });

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        moving.forEach(function (m) {
          m.node.style.transitionDelay = m.delay + 'ms';
          m.node.style.left = m.to.left + 'px';
          m.node.style.top = m.to.top + 'px';
          m.node.style.width = m.to.width + 'px';
          m.node.style.height = m.to.height + 'px';
          m.node.style.transform = 'rotate(0deg) scale(1)';
        });
      });
    });

    moving.forEach(function (m) {
      var settle = function () {
        m.node.classList.remove('flying');
        var c = m.node.style.getPropertyValue('--c');
        m.node.style.cssText = '';
        m.box.appendChild(m.node);
        if (c) m.node.style.setProperty('--c', c);
        m.node.classList.add('small');
        drawTreeLines();
      };
      m.node.addEventListener('transitionend', settle, { once: true });
      setTimeout(settle, 700 + m.delay);
    });
    setTimeout(drawTreeLines, 900 + moving.length * 90);
  }

  function buildTree(round) {
    els.treeSentence.innerHTML = '';
    var full = '';
    round.blocks.forEach(function (b, i) {
      full += b.text;
      var m = markAfter(round, i);
      if (m) full += m;
      if (i < round.blocks.length - 1) full += ' ';
    });
    els.treeSentence.appendChild(document.createTextNode(full));
    els.treeSentence.appendChild(el('span', 'ok', '✓'));

    /* 把 groups + blocks 组装成一棵真正的树。
       group 可以带 parent —— 从句嵌在主句里面（定语从句嵌在名词短语里），
       所以这里必须能递归，不能像以前那样写死两层。 */
    var nodes = {};
    round.groups.forEach(function (g) {
      nodes[g.id] = { g: g, blocks: [], kids: [], parent: g.parent || null };
    });
    round.blocks.forEach(function (b, i) {
      var n = nodes[b.group];
      if (!n) nodes[b.group] = n = { g: { id: b.group, label: b.group }, blocks: [], kids: [], parent: null };
      n.blocks.push({ b: b, i: i });
    });
    round.groups.forEach(function (g) {
      if (g.parent && nodes[g.parent]) nodes[g.parent].kids.push(g.id);
    });

    // 一个组（含它的所有子组）里第一块积木的位置 —— 用来决定左右顺序
    function minIdx(id) {
      var n = nodes[id], m = Infinity;
      n.blocks.forEach(function (x) { if (x.i < m) m = x.i; });
      n.kids.forEach(function (k) { var v = minIdx(k); if (v < m) m = v; });
      return m;
    }

    function renderLeaf(x) {
      var leaf = el('div', 'leaf' + (x.b.nonfinite ? ' nonfinite' : ''));
      leaf.dataset.i = String(x.i);
      leaf.dataset.uid = state.order[x.i];
      leaf.appendChild(el('div', 'leaf-slot'));
      var role = el('div', 'leaf-role', x.b.role);
      role.style.animationDelay = (0.7 + x.i * 0.05) + 's';
      leaf.appendChild(role);
      return leaf;
    }

    // 一个节点 = 标签 + 下面一排（积木和子组混在一起，按位置排）
    function renderNode(id, order) {
      var n = nodes[id];
      var wrap = el('div', 'tnode' + (n.g.clause ? ' clause' : ''));
      wrap.style.animationDelay = (0.1 + order * 0.12) + 's';
      wrap.dataset.gid = id;
      wrap.appendChild(el('div', 'tree-node', n.g.label));
      var row = el('div', 'tnode-kids');
      var list = n.blocks.map(function (x) { return { i: x.i, leaf: x }; })
        .concat(n.kids.map(function (k) { return { i: minIdx(k), gid: k }; }));
      list.sort(function (a, b) { return a.i - b.i; });
      list.forEach(function (x) {
        row.appendChild(x.leaf ? renderLeaf(x.leaf) : renderNode(x.gid, x.i));
      });
      wrap.appendChild(row);
      return wrap;
    }

    // 一个组（含所有子组）里有没有积木。
    // 练习模式的 groups 是整关共享的，有些句子用不到某个分组 ——
    // 那些分组不能画进树里，否则会多出一个空框。
    function hasBlocks(id, seen) {
      var n = nodes[id];
      if (!n) return false;
      if (n.blocks.length) return true;
      seen = seen || {};
      if (seen[id]) return false;
      seen[id] = true;
      return n.kids.some(function (k) { return hasBlocks(k, seen); });
    }

    els.treeGroups.innerHTML = '';
    var roots = [];
    round.groups.forEach(function (g) {
      if (!g.parent || !nodes[g.parent]) roots.push(g.id);
    });
    roots = roots.filter(function (id) { return hasBlocks(id); });
    roots.sort(function (a, b) { return minIdx(a) - minIdx(b); });
    roots.forEach(function (id, gi) { els.treeGroups.appendChild(renderNode(id, gi)); });
  }

  function drawTreeLines() {
    if (!els.board.classList.contains('tree-mode')) return;
    var canvas = els.treeCanvas.getBoundingClientRect();
    var svg = els.treeLines;
    svg.setAttribute('viewBox', '0 0 ' + canvas.width + ' ' + canvas.height);
    svg.setAttribute('width', canvas.width);
    svg.setAttribute('height', canvas.height);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    function box(node) {
      var r = node.getBoundingClientRect();
      return {
        cx: r.left - canvas.left + r.width / 2,
        top: r.top - canvas.top,
        bottom: r.bottom - canvas.top
      };
    }
    function elbow(from, to) {
      var ym = from.bottom + Math.max(0, (to.top - from.bottom) / 2);
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', 'M' + from.cx + ' ' + from.bottom + ' V' + ym + ' H' + to.cx + ' V' + to.top);
      svg.appendChild(p);
    }
    /* 一个节点长这样：第一个孩子是标签，第二个孩子是它下面那一排。
       那一排里可能混着积木（.leaf）和子组（.tnode），子组要递归连线 ——
       这就是从句能画出来的原因。 */
    function link(node) {
      var label = node.children[0], row = node.children[1];
      if (!label || !row) return;
      var from = box(label);
      Array.prototype.forEach.call(row.children, function (kid) {
        var head = kid.children[0];
        if (!head) return;
        elbow(from, box(head));
        if (kid.classList.contains('tnode')) link(kid);
      });
    }

    var rootBox = box(els.treeRoot);
    Array.prototype.forEach.call(els.treeGroups.children, function (node) {
      var head = node.children[0];
      if (!head) return;
      elbow(rootBox, box(head));
      link(node);
    });
  }
  window.addEventListener('resize', function () { setTimeout(drawTreeLines, 60); });

  /* ---------- 通关本关 / 重练结束 ---------- */
  // 这一轮里做错过的题目（跨关卡也能用）
  function wrongInSession() {
    return state.queue.filter(function (n) { return state.wrong[nodeKey(n)]; });
  }

  function finishLevel() {
    stopBossTimer();
    var lv = curLevel();
    els.playView.hidden = true;
    els.mapView.hidden = true;
    els.done.classList.add('show');
    var bad = wrongInSession();
    state.lastWrong = bad;

    // 结算页上的写作卡片：只有练习模式做完才给（闯关的例题太少，还没练熟）
    els.doneWriting.innerHTML = '';
    if (state.session === 'practice') {
      var wcard = writingCard(state.li);
      if (wcard) els.doneWriting.appendChild(wcard);
    }

    if (state.session === 'practice') {
      var done = state.queue.length;
      els.doneStars.textContent = bad.length ? '💪' : '✅';
      els.doneTitle.textContent = curLevel().id + ' · ' + curLevel().topic + ' 练习完成';
      els.doneStats.innerHTML =
        '<div><b>' + (done - bad.length) + '/' + done + '</b>一次就过</div>' +
        '<div><b>' + bad.length + '</b>需要重看</div>' +
        '<div><b>' + save.xp + '</b>总 XP</div>';
      els.doneNote.textContent = bad.length
        ? '做错的那 ' + bad.length + ' 句已经收进错题本了，随时可以去练。'
        : '这一组全对。想再来一遍可以再点一次练习模式。';
      els.btnReview.hidden = true;
      els.btnNextLevel.hidden = true;
      renderHud();
      sfx.level();
      return;
    }

    if (state.review) {
      var left = pocketCount();
      els.doneStars.textContent = bad.length ? '💪' : '✅';
      els.doneTitle.textContent = bad.length ? '这一轮还有没拿下的' : '这一轮全部拿下！';
      els.doneStats.innerHTML =
        '<div><b>' + state.queue.length + '</b>本轮句数</div>' +
        '<div><b>' + bad.length + '</b>仍需加强</div>' +
        '<div><b>' + left + '</b>错题本剩余</div>';
      els.doneNote.textContent = state.session === 'pocket'
        ? (left ? '错题本里还有 ' + left + ' 句没拿下，可以再来一轮。' : '错题本清空了 👍')
        : (bad.length ? '这几句刚才又错了。别急着走，再来一遍就记住了。' : '这几句你现在都能一次过了。');
      els.btnReview.hidden = bad.length === 0;
      els.btnReview.textContent = '再练这 ' + bad.length + ' 句';
      els.btnNextLevel.hidden = true;
      renderHud();
      sfx.level();
      return;
    }

    var total = 0, max = lv.rounds.length * 3;
    lv.rounds.forEach(function (r) { total += (state.levelStars[r.id] || 0); });
    var rating = Math.max(1, Math.round(total / max * 3));
    var s = levelSave(lv.id);
    s.cleared = true;
    s.stars = Math.max(s.stars || 0, rating);
    persist();

    els.doneStars.textContent = starStr(rating);
    els.doneTitle.textContent = lv.emoji + ' ' + lv.id + ' · ' + lv.topic + ' 通关！';
    els.doneStats.innerHTML =
      '<div><b>' + total + '/' + max + '</b>本关星数</div>' +
      '<div><b>Lv.' + levelOf(save.xp) + '</b>当前等级</div>' +
      '<div><b>' + save.xp + '</b>总 XP</div>';
    els.btnReview.hidden = bad.length === 0;
    els.btnReview.textContent = '重练答错的 ' + bad.length + ' 句';
    els.btnNextLevel.hidden = false;

    var nextLv = LEVELS[state.li + 1];
    if (lv.boss && !nextLv) {
      els.doneNote.textContent = '你通关了' + chapterOfLevel(state.li).name +
        '的全部 ' + chapterOfLevel(state.li).levels.length + ' 关。这一章结束了 —— 歇一会儿再开下一章。';
      els.btnNextLevel.textContent = '下一章（待做）';
      els.btnNextLevel.disabled = true;
    } else if (nextLv) {
      var sameChapter = nextLv._ci === lv._ci;
      els.doneNote.textContent = '下一关 ' + nextLv.id + ' · ' + nextLv.topic + '：' + nextLv.goal +
        (sameChapter ? '' : '（进入' + CHAPTERS[nextLv._ci].name + '）');
      els.btnNextLevel.textContent = '下一关 ' + nextLv.id + ' →';
      els.btnNextLevel.disabled = false;
    } else {
      els.doneNote.textContent = '';
      els.btnNextLevel.textContent = '下一关';
      els.btnNextLevel.disabled = true;
    }
    renderHud();
    sfx.level();
  }

  els.btnBackMap.addEventListener('click', function () {
    els.done.classList.remove('show');
    if (state.session === 'pocket') showPocket();
    else showMap();
  });
  // 写作提示词弹窗：点关闭按钮、点遮罩、按 Esc 都能关
  els.btnWpClose.addEventListener('click', closeWritingModal);
  els.wpModal.addEventListener('click', function (e) {
    if (e.target === els.wpModal) closeWritingModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && els.wpModal.classList.contains('show')) closeWritingModal();
  });
  els.btnNextLevel.addEventListener('click', function () {
    if (state.li + 1 < LEVELS.length) startLevel(state.li + 1);
  });
  els.btnReview.addEventListener('click', function () {
    if (!state.lastWrong.length) return;
    els.done.classList.remove('show');
    startSession(state.lastWrong.map(function (n) { return { li: n.li, ri: n.ri, src: n.src }; }),
      state.session === 'pocket' ? 'pocket' : 'review', state.li);
  });

  els.btnPocket.addEventListener('click', showPocket);
  els.btnPocketBack.addEventListener('click', showMap);
  els.btnPocketAll.addEventListener('click', function () {
    var list = pocketList(false);
    if (!list.length) return;
    // 打散一下，免得靠位置记答案
    var nodes = list.map(function (it) { return { li: it.li, ri: it.ri, src: it.src }; });
    for (var i = nodes.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = nodes[i]; nodes[i] = nodes[j]; nodes[j] = tmp;
    }
    startSession(nodes, 'pocket');
  });
  els.btnMap.addEventListener('click', showMap);

  /* ---------- 启动 ---------- */
  function boot() {
    buildPractice();
    showMap();
    window.addEventListener('pointerdown', function once() {
      audio();
      window.removeEventListener('pointerdown', once);
    });
  }
  boot();

  /* ---------- 给 smoke-test.js 留的可断言出口 ---------- */
  window.__GB__ = {
    DATA: DATA, CHAPTERS: CHAPTERS, LEVELS: LEVELS, POS: POS,
    state: state, els: els,
    targetOf: targetOf, punctOf: punctOf, starCountFor: starCountFor,
    levelOf: levelOf, starStr: starStr,
    isUnlocked: isUnlocked, isChapterUnlocked: isChapterUnlocked, levelSave: levelSave,
    showMap: showMap, showPocket: showPocket, startLevel: startLevel, startRound: startRound,
    startSession: startSession, curNode: curNode,
    startPractice: startPractice, practiceRounds: practiceRounds,
    writingPromptOf: writingPromptOf, writingCard: writingCard,
    openWritingModal: openWritingModal, closeWritingModal: closeWritingModal,
    pocketList: pocketList, pocketCount: pocketCount,
    noteWrong: noteWrong, noteRight: noteRight,
    nextRound: nextRound, placeInto: placeInto, backToTray: backToTray,
    tapBlock: tapBlock, submit: submit, wrongInSession: wrongInSession,
    hint: function () { els.btnHint.click(); },
    uidByText: function (text) {
      var all = state.tray.concat(state.slots.filter(Boolean));
      for (var i = 0; i < all.length; i++) if (state.pool[all[i]].text === text) return all[i];
      return null;
    }
  };
})();
</script>
